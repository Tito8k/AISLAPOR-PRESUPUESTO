document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

if;text-decoration:none;white-space:nowrap;background:#1f1e1c;color:#fff\">1.0<\/a><a href=\"zigzag.html#2\" style=\"flex:1 1 auto;text-align:center;padding:6px 9px;font:500 12px 'IBM Plex Sans',sans-serif;text-decoration:none;white-space:nowrap;background:#fff;color:#1f1e1c\">2.0<\/a><a href=\"zigzag.html#3\" style=\"flex:1 1 auto;text-align:center;padding:6px 9px;font:500 12px 'IBM Plex Sans',sans-serif;text-decoration:none;white-space:nowrap;background:#fff;color:#1f1e1c\">3.0<\/a><a href=\"original.html\" style=\"flex:1 1 auto;text-align:center;padding:6px 9px;font:500 12px 'IBM Plex Sans',sans-serif;text-decoration:none;white-space:nowrap;background:#fff;color:#1f1e1c\">4<\/a><a href=\"equipos.html\" style=\"flex:1 1 auto;text-align:center;padding:6px 9px;font:500 12px 'IBM Plex Sans',sans-serif;text-decoration:none;white-space:nowrap;background:#fff;color:#1f1e1c\">Otras<\/a><a href=\"validacion.html\" style=\"flex:1 1 auto;text-align:center;padding:6px 9px;font:500 12px 'IBM Plex Sans',sans-serif;text-decoration:none;white-space:nowrap;background:#fff;color:#1f1e1c\">Validación<\/a><\/div><div style=\"display:flex;flex-wrap:wrap;border:1px solid #cfcbc3;border-radius:4px;overflow:hidden;background:#fff\"><a href=\"zigzag-1.html\" style=\"flex:1 1 auto;text-align:center;padding:6px 9px;font:500 12px 'IBM Plex Sans',sans-serif;text-decoration:none;white-space:nowrap;background:#fff;color:#1f1e1c\">Modelo 3D<\/a><a href=\"simulacion.html\" style=\"flex:1 1 auto;text-align:center;padding:6px 9px;font:500 12px 'IBM Plex Sans',sans-serif;text-decoration:none;white-space:nowrap;background:#1f1e1c;color:#fff\">Simulación<\/a><a href=\"planos.html\" style=\"flex:1 1 auto;text-align:center;padding:6px 9px;font:500 12px 'IBM Plex Sans',sans-serif;text-decoration:none;white-space:nowrap;background:#fff;color:#1f1e1c\">Planos<\/a><a href=\"presupuesto.html#caja\" style=\"flex:1 1 auto;text-align:center;padding:6px 9px;font:500 12px 'IBM Plex Sans',sans-serif;text-decoration:none;white-space:nowrap;background:#fff;color:#1f1e1c\">Presupuesto<\/a><\/div><\/div>\n  <div>\n    <h1>1.0 · Simulación física<\/h1>\n    <div class=\"sub\">Prototipo construido · columna zig-zag + cámara de decantación<\/div>\n    \n  <\/div>\n  <div class=\"blk\">\n    <h2>Controles<\/h2>\n    <label class=\"sl\"><span class=\"t\">Caudal del soplador (succión) <b id=\"vQ\"><\/b><\/span><input id=\"q\" type=\"range\" min=\"10\" max=\"200\" step=\"1\" value=\"80\"><\/label>\n    <label class=\"sl\"><span class=\"t\">Alimentación <b id=\"vF\"><\/b><\/span><input id=\"f\" type=\"range\" min=\"2\" max=\"60\" step=\"1\" value=\"20\"><\/label>\n    <label class=\"sl\"><span class=\"t\">Adherencia del polvillo (electrostática) <b id=\"vA\"><\/b><\/span><input id=\"adh\" type=\"range\" min=\"0\" max=\"0.8\" step=\"0.05\" value=\"0.5\"><\/label>\n    <label class=\"sl\"><span class=\"t\">Densidad EPS <b id=\"vR\"><\/b><\/span><input id=\"rho\" type=\"range\" min=\"5\" max=\"30\" step=\"0.5\" value=\"10\"><\/label>\n    <label class=\"sl\"><span class=\"t\">Posición de la succión (desde la columna) <b id=\"vX\"><\/b><\/span><input id=\"px\" type=\"range\" min=\"330\" max=\"700\" step=\"10\" value=\"351\"><\/label>\n    <label class=\"sl\"><span class=\"t\">Velocidad de simulación <b id=\"vT\"><\/b><\/span><input id=\"ts\" type=\"range\" min=\"0.05\" max=\"1\" step=\"0.05\" value=\"1\"><\/label>\n    <div class=\"btns\">\n      <button id=\"play\" class=\"on\">❚❚ Pausa<\/button>\n      <button id=\"reset\">Reiniciar<\/button>\n      <button id=\"front\" class=\"on\">Frente acrílico<\/button>\n      <button id=\"air\">Aire<\/button>\n      <button id=\"col\">Color por fracción<\/button>\n    <\/div>\n    <div class=\"btns\" id=\"cfdBtns\"><button data-cfd=\"off\" class=\"on\">Normal<\/button><button data-cfd=\"p\">CFD presión<\/button><button data-cfd=\"v\">CFD velocidad<\/button><\/div>\n    <div id=\"legend\"><\/div>\n  <\/div>\n  <div class=\"blk\"><h2>Estado del aire<\/h2><div class=\"rows\" id=\"state\"><\/div><\/div>\n  <div class=\"blk\">\n    <h2>Resultado por salida<\/h2>\n    <div class=\"rows\" id=\"kpi\"><\/div>\n    <div id=\"comp\" style=\"display:flex;flex-direction:column;gap:10px\"><\/div>\n    <div style=\"display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11px;color:#5b5852\" id=\"cleg\"><\/div>\n    <div class=\"rows\" id=\"extra\"><\/div>\n  <\/div>\n  <div class=\"blk\"><div class=\"note\">El aire entra por la base abierta de la columna y sale por la succión de 2 in y la manguera hacia un soplador centrífugo pequeño (400 W) conectado al revés. Velocidad terminal calculada con Cd de Clift-Gauvin (perla de 4 mm a 10 kg/m³ ≈ 0.67 m/s; polvillo de 0.3 mm ≈ 0.02 m/s). La succión se trata como un tubo (sumidero 3D, U ∝ 1/r²), no como una ranura. El polvillo de EPS se carga electrostáticamente: se pega a las perlas grandes (se suelta solo con impactos fuertes) y a las paredes y el acrílico, que en una caja de 150 mm de fondo están muy cerca. Por eso llega poco polvillo al soplador aunque su velocidad terminal sea casi cero. El slider de adherencia controla qué tan fuerte es ese efecto. Cada partícula representa la misma masa. Tamaños supuestos: &lt;0.3 mm 3 %, 0.3–0.7 5 %, 0.7–1.45 12 %, 1.45–4.75 47 %, 4.75–9 33 %.<\/div><\/div>\n  \n<\/div>\n<script src=\"356196b1-f830-4117-bdaf-3141fcfaf050\"><\/script>\n<script type=\"module\">\nconst {buildCaja} = (() => {\n// Clasificador zig-zag construido: una sola caja (columna + cámara de decantación). Metros, y arriba. Recibe THREE.\nfunction buildCaja(THREE) {\n  const DS = THREE.DoubleSide;\n  const M = {\n    mdf:     new THREE.MeshStandardMaterial({ name: 'mdf', color: 0xc39b6a, roughness: 0.82, side: DS }),\n    foil:    new THREE.MeshStandardMaterial({ name: 'forro_aluminio', color: 0xc9ccd0, metalness: 0.5, roughness: 0.42, side: DS }),\n    acrylic: new THREE.MeshStandardMaterial({ name: 'acrilico', color: 0xd6ebf0, metalness: 0, roughness: 0.05, transparent: true, opacity: 0.14, side: DS, depthWrite: false }),\n    pvc:     new THREE.MeshStandardMaterial({ name: 'pvc', color: 0xf2f1ed, roughness: 0.5, side: DS }),\n    blower:  new THREE.MeshStandardMaterial({ name: 'soplador_amarillo', color: 0xf2c21b, roughness: 0.45, side: DS }),\n    motor:   new THREE.MeshStandardMaterial({ name: 'soplador_motor', color: 0x2a2a2a, roughness: 0.6, side: DS }),\n    hose:    new THREE.MeshStandardMaterial({ name: 'manguera', color: 0x2f9e96, roughness: 0.55, side: DS }),\n    eps:     new THREE.MeshStandardMaterial({ name: 'caja_icopor', color: 0xf6f5f1, roughness: 0.9, side: DS }),\n    steel:   new THREE.MeshStandardMaterial({ name: 'soporte', color: 0x6b6f73, metalness: 0.4, roughness: 0.5, side: DS }),\n  };\n  const B = 0.30, D = 0.150, pz = D / 2, TW = 0.015, TB = 0.005;\n  const X = v => v / 1000, Y = v => B + v / 1000;\n  const root = new THREE.Group(); root.name = 'clasificador_caja';\n  const grp = (name, section) => { const g = new THREE.Group(); g.name = name; g.userData.section = section; root.add(g); return g; };\n  const fin = (m, name, parent) => { m.name = name; m.castShadow = m.receiveShadow = true; parent.add(m); return m; };\n  const box = (name, mat, w, h, d, x, y, z, parent, rz = 0) => { const m = fin(new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat), name, parent); m.position.set(x, y, z); m.rotation.z = rz; return m; };\n  const segs = [];\n  // Placa entre dos puntos (mm) del plano frontal, espesor th (mm), profundidad interior completa; v = valor de ψ para el cálculo de aire\n  function slab(name, mat, [x0, y0], [x1, y1], th, parent, v) {\n    const ax = X(x0), ay = Y(y0), bx = X(x1), by = Y(y1), L = Math.hypot(bx - ax, by - ay);\n    box(name, mat, L, th / 1000, D, (ax + bx) / 2, (ay + by) / 2, 0, parent, Math.atan2(by - ay, bx - ax));\n    if (v !== undefined) segs.push({ a: ax, b: ay, c: bx, d: by, th: th / 1000, v, name });\n  }\n\n  /* ---------- Cotas del plano (mm) ---------- */\n  const H = 1090, Wc = 211, xDiv = 211, xCh0 = 226, Wch = 500, xCh1 = xCh0 + Wch, xOut = xCh1 + 15;\n  const bL = 121, bdx = bL * Math.sin(Math.PI / 6), bdy = bL * Math.cos(Math.PI / 6);   // 60.5 × 104.8\n  const leftTops = [805, 605, 415, 225], rightTops = [710, 520, 325];\n  const tipL = bdx, tipR = Wc - bdx;                                                  // paso libre 90 mm\n  const lp0 = [tipR, 800], lpAtDiv = 800 + bdy, lp1 = [xDiv + 7.5, lpAtDiv];              // rampa: termina en la divisoria\n  const up0 = [xCh0, lpAtDiv + 90], up1 = [xCh0 + 100 * Math.cos(Math.PI / 3), up0[1] - 100 * Math.sin(Math.PI / 3)]; // labio hacia abajo, 60°\n  const chim = [60, 152], chimH = 90, portX = 351, portR = 25;\n  const dg0 = [xCh0, 880], dg1 = [659, 324];\n\n  /* ===== 1 · Alimentación ===== */\n  const S1 = grp('seccion_1_alimentacion', 1);\n  slab('chimenea_pared_izq', M.mdf, [chim[0] - 6.5, H], [chim[0] - 6.5, H + chimH], 13, S1, 1);\n  slab('chimenea_pared_der', M.mdf, [chim[1] + 6.5, H], [chim[1] + 6.5, H + chimH], 13, S1, 1);\n  for (const s of [-1, 1]) box('chimenea_' + (s < 0 ? 'post' : 'frontal'), s < 0 ? M.mdf : M.acrylic, X(chim[1] - chim[0] + 26), X(chimH), 0.013, X((chim[0] + chim[1]) / 2), Y(H + chimH / 2), s * (pz + 0.0065), S1);\n  segs.push({ a: X(chim[0] - 13), b: Y(H + chimH), c: X(chim[1] + 13), d: Y(H + chimH), th: 0.013, v: 1, name: 'alimentacion_cerrada' });\n\n  /* ===== 2 · Columna zig-zag ===== */\n  const S2 = grp('seccion_2_columna_zigzag', 2);\n  slab('columna_pared_izq', M.mdf, [-7.5, 0], [-7.5, H], 15, S2, 1);\n  slab('columna_pared_divisoria', M.mdf, [xDiv + 7.5, 0], [xDiv + 7.5, lpAtDiv], 15, S2, 0);\n  const stageAnchors = [];\n  leftTops.forEach((t, i) => { slab('deflector_izq_' + (i + 1), M.foil, [0, t], [tipL, t - bdy], 5, S2, 1); stageAnchors.push([X(tipL / 2), Y(t - bdy / 2), pz]); });\n  rightTops.forEach((t, i) => { slab('deflector_der_' + (i + 1), M.foil, [Wc, t], [tipR, t - bdy], 5, S2, 0); stageAnchors.push([X(Wc - bdx / 2), Y(t - bdy / 2), pz]); });\n\n  /* ===== 3 · Paso a la cámara: rampa + labio hacia abajo (no se tapona) ===== */\n  const S3 = grp('seccion_3_salida_60', 3);\n  slab('placa_salida_inferior', M.foil, lp0, lp1, 5, S3, 0);\n  slab('placa_salida_superior', M.foil, up0, up1, 5, S3, 1);\n  slab('divisoria_superior', M.mdf, [xDiv + 7.5, up0[1]], [xDiv + 7.5, H - TW], 15, S3, 1);\n\n  /* ===== 4 · Cámara de decantación ===== */\n  const S4 = grp('seccion_4_camara', 4);\n  slab('camara_pared_der', M.mdf, [xCh1 + 7.5, 0], [xCh1 + 7.5, H], 15, S4, 0);\n  slab('camara_fondo', M.mdf, [xCh0, 7.5], [xCh1, 7.5], 15, S4, 0);\n  slab('placa_inclinada', M.foil, dg0, dg1, 6, S4, 0);\n\n  /* ===== 5 · Succión ===== */\n  const S5 = grp('seccion_5_succion', 5);\n  const tube = (name, mat, ro, ri, len, x, y, z, parent) => {\n    const pr = [[ri, -len / 2], [ro, -len / 2], [ro, len / 2], [ri, len / 2], [ri, -len / 2]].map(([a, b]) => new THREE.Vector2(a, b));\n    const m = fin(new THREE.Mesh(new THREE.LatheGeometry(pr, 40), mat), name, parent); m.position.set(x, y, z); return m;\n  };\n  tube('succion_pvc_2in', M.pvc, X(portR + 3), X(portR), 0.10, X(portX), Y(H) + 0.05, 0, S5);\n  tube('succion_union', M.pvc, X(portR + 7), X(portR + 2), 0.035, X(portX), Y(H) + 0.10, 0, S5);\n  { const c = new THREE.CatmullRomCurve3([new THREE.Vector3(X(portX), Y(H) + 0.11, 0), new THREE.Vector3(X(portX), Y(H) + 0.22, 0), new THREE.Vector3(X(portX) + 0.12, Y(H) + 0.30, 0), new THREE.Vector3(X(portX) + 0.45, Y(H) + 0.31, 0)]);\n    fin(new THREE.Mesh(new THREE.TubeGeometry(c, 40, X(portR + 6), 16, false), M.hose), 'manguera_aspiradora', S5);\n    // soplador/aspiradora centrífugo pequeño (tipo 400 W), conectado al revés: la manguera entra al ojo de succión\n    const bl = new THREE.Group(); bl.name = 'soplador_centrifugo'; S5.add(bl);\n    const hx = X(portX) + 0.45, hy = Y(H) + 0.31, R0 = 0.07, W = 0.075, cxB = hx + 0.03 + W / 2;\n    const rx = (mm, x, y, z) => { mm.rotation.z = Math.PI / 2; mm.position.set(x, y, z); return mm; };\n    rx(fin(new THREE.Mesh(new THREE.CylinderGeometry(X(portR + 9), X(portR + 9), 0.03, 24), M.motor), 'soplador_acople', bl), hx + 0.015, hy, 0);\n    rx(fin(new THREE.Mesh(new THREE.CylinderGeometry(R0, R0, W, 36), M.blower), 'soplador_voluta', bl), cxB, hy, 0);\n    const lobe = rx(fin(new THREE.Mesh(new THREE.CylinderGeometry(R0 * 0.55, R0 * 0.55, W, 24), M.blower), 'soplador_voluta_lobulo', bl), cxB, hy - 0.035, -0.04);\n    rx(fin(new THREE.Mesh(new THREE.TorusGeometry(R0 * 0.45, 0.004, 8, 28), M.motor), 'soplador_rejilla', bl), hx + 0.03, hy, 0).rotation.set(0, Math.PI / 2, 0);\n    box('soplador_salida', M.blower, W * 0.7, 0.09, 0.05, cxB, hy - 0.09, -0.055, bl);\n    const bag = fin(new THREE.Mesh(new THREE.SphereGeometry(0.05, 18, 12), M.motor), 'soplador_bolsa', bl); bag.scale.set(0.9, 1.3, 0.8); bag.position.set(cxB, hy - 0.17, -0.055);\n    const hc2 = new THREE.CatmullRomCurve3([new THREE.Vector3(cxB, hy + 0.06, 0.04), new THREE.Vector3(cxB, hy + 0.12, 0.02), new THREE.Vector3(cxB, hy + 0.12, -0.06), new THREE.Vector3(cxB, hy + 0.05, -0.08)]);\n    fin(new THREE.Mesh(new THREE.TubeGeometry(hc2, 20, 0.014, 10, false), M.blower), 'soplador_manija', bl); }\n\n  /* ===== 6 · Caja, frente y soporte ===== */\n  const S6 = grp('seccion_6_caja', 6);\n  function makeTop(px) { const o = new THREE.Shape([new THREE.Vector2(X(-15), -(pz + TW)), new THREE.Vector2(X(xOut), -(pz + TW)), new THREE.Vector2(X(xOut), pz + TB), new THREE.Vector2(X(-15), pz + TB)].map(v => new THREE.Vector2(v.x, -v.y)));\n    const hr = new THREE.Path([new THREE.Vector2(X(chim[0]), -pz), new THREE.Vector2(X(chim[1]), -pz), new THREE.Vector2(X(chim[1]), pz), new THREE.Vector2(X(chim[0]), pz)]); o.holes.push(hr);\n    const hc = new THREE.Path(); hc.absarc(X(px), 0, X(portR), 0, Math.PI * 2, true); o.holes.push(hc);\n    const g = new THREE.ExtrudeGeometry(o, { depth: TW, bevelEnabled: false, curveSegments: 32 }); g.rotateX(-Math.PI / 2); g.translate(0, Y(H - TW), 0);\n    return fin(new THREE.Mesh(g, M.mdf), 'tapa', S6); }\n  makeTop(portX);\n  segs.push({ a: X(-15), b: Y(H - 7.5), c: X(chim[0]), d: Y(H - 7.5), th: TW, v: 1, name: 'tapa_1' });\n  segs.push({ a: X(chim[1]), b: Y(H - 7.5), c: X(portX - portR), d: Y(H - 7.5), th: TW, v: 1, name: 'tapa_2' });\n  segs.push({ a: X(portX + portR), b: Y(H - 7.5), c: X(xOut), d: Y(H - 7.5), th: TW, v: 0, name: 'tapa_3' });\n  box('fondo_posterior', M.foil, X(xOut + 15), X(H), TW, X((xOut - 15) / 2), Y(H / 2), -pz - TW / 2, S6);\n  box('frente_acrilico', M.acrylic, X(xOut + 15), X(H), TB, X((xOut - 15) / 2), Y(H / 2), pz + TB / 2, S6);\n  for (const x of [X(-15) + 0.015, X(xOut) - 0.015]) for (const z of [-pz - 0.005, pz - 0.01]) box('pata', M.steel, 0.03, B, 0.03, x, B / 2, z, S6);\n  box('travesano_post', M.steel, X(xOut + 15), 0.03, 0.03, X((xOut - 15) / 2), B - 0.015, -pz - 0.005, S6);\n  box('travesano_frontal', M.steel, X(xOut + 15 - xCh0) + 0.03, 0.03, 0.03, X((xOut + xCh0) / 2), B - 0.015, pz - 0.01, S6);\n  // caja de icopor bajo la columna (material útil)\n  const bin = { x0: -0.06, x1: 0.27, z0: -0.13, z1: 0.13, y0: 0.01, h: 0.19 };\n  { const g = new THREE.Group(); g.name = 'recipiente_util'; S6.add(g); g.userData.section = 6;\n    const w = bin.x1 - bin.x0, d = bin.z1 - bin.z0, cx = (bin.x0 + bin.x1) / 2, t = 0.02;\n    box('recipiente_fondo', M.eps, w, t, d, cx, bin.y0 - t / 2 + 0.01, 0, g);\n    box('recipiente_izq', M.eps, t, bin.h, d, bin.x0 + t / 2, bin.y0 + bin.h / 2, 0, g);\n    box('recipiente_der', M.eps, t, bin.h, d, bin.x1 - t / 2, bin.y0 + bin.h / 2, 0, g);\n    box('recipiente_post', M.eps, w, bin.h, t, cx, bin.y0 + bin.h / 2, bin.z0 + t / 2, g);\n    box('recipiente_frontal', M.eps, w, bin.h, t, cx, bin.y0 + bin.h / 2, bin.z1 - t / 2, g); }\n\n  const sections = [\n    { id: 1, group: S1, anchor: [X(106), Y(H + chimH) + 0.03, 0] },\n    { id: 2, group: S2, anchor: [-0.05, Y(500), pz] },\n    { id: 3, group: S3, anchor: [X(250), Y(960), pz] },\n    { id: 4, group: S4, anchor: [X(520),
